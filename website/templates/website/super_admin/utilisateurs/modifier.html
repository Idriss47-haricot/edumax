{% extends 'website/base_dashboard.html' %}

{% block title %}Modifier un utilisateur{% endblock %}
{% block page_title %}Modifier l'utilisateur : {{ utilisateur.username }}{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">
                    <i class="fas fa-user-edit me-2 text-primary"></i>
                    Modification
                </h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Nom d'utilisateur</label>
                        <input type="text" class="form-control" value="{{ utilisateur.username }}" disabled>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Prénom</label>
                        <input type="text" name="prenom" class="form-control" value="{{ utilisateur.prenom }}">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ utilisateur.email }}">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Téléphone</label>
                        <input type="text" name="telephone" class="form-control" value="{{ utilisateur.telephone|default:'' }}">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Pays</label>
                        <input type="text" name="pays" class="form-control" value="{{ utilisateur.pays|default:'' }}">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Rôle</label>
                        <select name="role" class="form-control">
                            <option value="super_admin" {% if utilisateur.role == 'super_admin' %}selected{% endif %}>Super Administrateur</option>
                            <option value="admin_ecole" {% if utilisateur.role == 'admin_ecole' %}selected{% endif %}>Administrateur École</option>
                            <option value="enseignant" {% if utilisateur.role == 'enseignant' %}selected{% endif %}>Enseignant</option>
                            <option value="etudiant" {% if utilisateur.role == 'etudiant' %}selected{% endif %}>Étudiant</option>
                        </select>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if utilisateur.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">Compte actif</label>
                    </div>
                    
                    <hr>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'super_admin_utilisateurs' %}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-1"></i>Annuler
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
