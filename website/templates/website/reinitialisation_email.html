{% extends 'website/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3 class="mb-0">Réinitialisation du mot de passe</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Nouveau mot de passe *</label>
                            <input type="password" name="password" class="form-control" required>
                            <small class="text-muted">8 caractères min, une majuscule, une minuscule, un chiffre</small>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Confirmer le mot de passe *</label>
                            <input type="password" name="confirm_password" class="form-control" required>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Réinitialiser</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
